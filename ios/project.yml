name: VideoGrabber

options:
  bundleIdPrefix: com.vanelliafk
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: pt-BR
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "1"
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  VideoGrabber:
    type: application
    platform: iOS
    sources:
      - path: VideoGrabber
    dependencies:
      - target: VideoGrabberShare
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vanelliafk.videograbber
    info:
      path: VideoGrabber/Resources/Info.plist
      properties:
        CFBundleDisplayName: VideoGrabber
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: pt-BR
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIBackgroundModes:
          - audio
        ITSAppUsesNonExemptEncryption: false
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: O VideoGrabber se conecta ao seu servidor na rede local para preparar os downloads.
        NSPhotoLibraryAddUsageDescription: O VideoGrabber salva no Rolo da Câmera os vídeos que você escolher.
        CFBundleURLTypes:
          - CFBundleURLName: com.vanelliafk.videograbber
            CFBundleURLSchemes:
              - videograbber
    scheme:
      testTargets:
        - VideoGrabberTests
        - VideoGrabberUITests
      gatherCoverageData: true

  VideoGrabberShare:
    type: app-extension
    platform: iOS
    sources:
      - path: VideoGrabberShare
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vanelliafk.videograbber.share
    info:
      path: VideoGrabberShare/Info.plist
      properties:
        CFBundleDisplayName: VideoGrabber
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsText: true

  VideoGrabberTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: VideoGrabberTests
    dependencies:
      - target: VideoGrabber
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.vanelliafk.videograbber.tests

  VideoGrabberUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: VideoGrabberUITests
    dependencies:
      - target: VideoGrabber
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.vanelliafk.videograbber.uitests
